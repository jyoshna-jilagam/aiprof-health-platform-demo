{% extends "base.html" %}{% block content %}<h1>{{ hospital.name }} Configuration</h1><div class="card"><form method="post"><label>Departments (comma separated)</label><input name="departments" value="{{ (settings.departments_json|from_json)|join(', ') if settings else '' }}"><label>Specialties</label><input name="specialties" value="{{ (settings.specialties_json|from_json)|join(', ') if settings else '' }}"><label>Appointment types</label><input name="appointment_types" value="{{ (settings.appointment_types_json|from_json)|join(', ') if settings else '' }}"><label>Integration</label><input name="integration_name" value="{{ settings.integration_name if settings else 'Mock EHR' }}"><label><input type="checkbox" name="email" style="width:auto"> Email notifications</label><label><input type="checkbox" name="sms" style="width:auto"> SMS notifications</label><button class="btn" style="margin-top:16px">Save Configuration</button></form></div>{% endblock %}
